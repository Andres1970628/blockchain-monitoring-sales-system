<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Monitor Pro | Dashboard Demo</title>
  <meta name="description" content="Interactive blockchain operations dashboard demo." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">B</div>
        <div>
          <div class="brand-name">Blockchain Monitor Pro</div>
          <small>Operations console</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Overview</div>
        <div class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</div>
        <div class="nav-item"><i class="fa-solid fa-shield-halved"></i> Security</div>
        <div class="nav-item"><i class="fa-solid fa-wallet"></i> Treasury</div>
        <div class="nav-item"><i class="fa-solid fa-server"></i> Nodes</div>
      </nav>

      <div class="watchlist">
        <div class="nav-label">Watchlist</div>
        <div class="watch-row"><span>ETH</span><strong>$2,845</strong><em class="up">+4.2%</em></div>
        <div class="watch-row"><span>BTC</span><strong>$65,230</strong><em class="up">+2.8%</em></div>
        <div class="watch-row"><span>SOL</span><strong>$142.50</strong><em class="down">-1.3%</em></div>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div>
          <div class="header-kicker">Capital monitoring console</div>
          <h1>Operations Dashboard</h1>
        </div>

        <div class="header-controls">
          <div class="segmented-control">
            <button class="segment active" data-mode="demo">Demo</button>
            <button class="segment" data-mode="live">Live</button>
          </div>
          <div class="status-pill"><span class="pulse"></span>Connected</div>
        </div>
      </header>

      <section class="metrics-grid" id="metricsGrid"></section>

      <section class="content-grid">
        <div class="panel panel-large">
          <div class="panel-header">
            <h3>Network activity</h3>
            <div class="segmented-control small">
              <button class="range active" data-range="1H">1H</button>
              <button class="range" data-range="24H">24H</button>
              <button class="range" data-range="7D">7D</button>
              <button class="range" data-range="30D">30D</button>
            </div>
          </div>
          <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
        </div>

        <div class="panel side-panel">
          <div class="panel-header"><h3>Signal mix</h3></div>
          <div class="signal-list" id="signalList"></div>
        </div>
      </section>

      <section class="content-grid bottom-grid">
        <div class="panel">
          <div class="panel-header"><h3>Recent transactions</h3></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Network</th>
                  <th>Hash</th>
                  <th>Type</th>
                  <th>Amount</th>
                  <th>Fee</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="txTable"></tbody>
            </table>
          </div>
        </div>

        <div class="panel side-panel">
          <div class="panel-header"><h3>Alerts</h3></div>
          <div class="alert-list" id="alertList"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
